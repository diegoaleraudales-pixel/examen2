<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Orderr - Framework7</title>
<link href="css/framework7.bundle.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>

<body>
    <div id="app">
        <section class="panel panel-left panel-cover">
            <div class="block">
                <p>Menú de Usuario</p>
            </div>
			<div class="block">
				<div class="list links-list">
					<ul>
            <li>
                <a href="/home/" class="item-link item-content panel-close">
                    <div class="item-media">
                        <i class="material-icons">home</i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title">Home</div>
                    </div>
                </a>
            </li>
            <li>
                <a href="/categories/" class="item-link item-content panel-close">
                    <div class="item-media">
                        <i class="material-icons">menu_open</i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title">Categories</div>
                    </div>
                </a>
            </li>
            <li>
                <a href="/favorites/" class="item-link item-content panel-close">
                    <div class="item-media">
                        <i class="material-icons">favorite_border</i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title">Favorites</div>
                    </div>
                </a>
            </li>
            <li>
                <a href="/orders/" class="item-link item-content panel-close">
                    <div class="item-media">
                        <i class="material-icons">shopping_bag</i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title">My Orders</div>
                    </div>
                </a>
            </li>
        </ul>
    </div>
        </section>
        
       <div class="page" data-name="categories">
  
  <div class="navbar">
    <div class="navbar-bg"></div>
    <div class="navbar-inner">
      <div class="left">
        <a href="#" class="link back">
          <i class="material-icons">chevron_left</i>
        </a>
      </div>
      <div class="title">Categories</div>
      <div class="right">
        <a href="#" class="link panel-open" data-panel="left">
          <i class="material-icons">menu</i>
        </a>
      </div>
    </div>
  </div>

  <div class="page-content">
    <div class="list no-hairlines-md custom-categories-list">
      
      <div class="cat-card">
        <div class="cat-card-image">
          <img src="https://img.freepik.com/free-photo/delicious-burger-with-fresh-ingredients_23-2150857908.jpg" alt="burger">
        </div>
        <div class="cat-card-info">
          <span class="cat-card-title">Hamburger</span>
        </div>
        <div class="cat-card-action">
          <button class="black-add-btn"><i class="material-icons">add</i></button>
        </div>
      </div>

      <div class="cat-card">
        <div class="cat-card-image">
          <img src="https://img.freepik.com/free-photo/top-view-pepperoni-pizza-with-mushroom-sausages-bell-pepper-olive-corn-black-wooden_141793-2158.jpg" alt="pizza">
        </div>
        <div class="cat-card-info">
          <span class="cat-card-title">Pizzas</span>
        </div>
        <div class="cat-card-action">
          <button class="black-add-btn"><i class="material-icons">add</i></button>
        </div>
      </div>

      <div class="cat-card">
        <div class="cat-card-image">
          <img src="img/donas-ig02.webp" height="100%" width="auto" alt="donuts">
        </div>
        <div class="cat-card-info">
          <span class="cat-card-title">Donuts</span>
        </div>
        <div class="cat-card-action">
          <button class="black-add-btn"><i class="material-icons">add</i></button>
        </div>
      </div>

      <div class="cat-card">
        <div class="cat-card-image">
          <img src="https://img.freepik.com/free-photo/double-hamburger-isolated-white-background-fresh-cheeseburger-fast-food-with-beef-cheese_90220-1063.jpg" alt="big mac">
        </div>
        <div class="cat-card-info">
          <span class="cat-card-title">Big Mac Bacon</span>
          <span class="cat-card-subtitle">Hamburger</span>
          <span class="cat-card-price">$6.70</span>
        </div>
        <div class="cat-card-action">
          <button class="black-add-btn"><i class="material-icons">add</i></button>
        </div>
      </div>

    </div>
  </div>
    
              </section> </section> <div class="toolbar toolbar-bottom ">
                <div class="toolbar-inner">
                  <a href="/home/" class="link"><i class="material-icons">home</i></a>
                  <a href="/categories/" class="link"><i class="material-icons">menu_open</i></a>
                  <a href="#" class="link"><i class="material-icons">shopping_basket</i></a>
                  <a href="#" class="link"><i class="material-icons">notifications</i></a>
                  <a href="#" class="link"><i class="material-icons">person</i></a>
                </div>
            </div>
            
        </div></div><script src="js/framework7.bundle.min.js"></script>
    <script src="js/app.js"></script>
    
    
    
    
    
</body>
</html>
